name: Deploy to VPS

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: myteam-prod-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Add VPS to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p ${{ secrets.VPS_PORT }} -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy on VPS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TOKEN_B64="$(printf '%s' "$GH_TOKEN" | base64 -w0)"
          ssh -p ${{ secrets.VPS_PORT }} ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "GH_TOKEN_B64='$TOKEN_B64' bash -s" <<'EOF'
          set -e
          TOKEN="$(printf '%s' "$GH_TOKEN_B64" | base64 -d)"
          cd /var/www/MyTeam
          ORIGINAL_REMOTE="$(git remote get-url origin)"
          restore_remote() {
            git remote set-url origin "$ORIGINAL_REMOTE"
          }
          trap restore_remote EXIT
          git remote set-url origin "https://x-access-token:${TOKEN}@github.com/moozuk22/MyTeam.git"
          /root/deploy-my-team.sh
          EOF
